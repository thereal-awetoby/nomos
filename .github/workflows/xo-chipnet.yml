name: XO chipnet demo

on:
  push:
    branches: [arena/**]

jobs:
  chipnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: xo
        run: npm ci --no-audit --no-fund

      - name: Generate keys on runner
        id: keys
        working-directory: xo
        run: |
          node scripts/chipnet.mjs keys > /tmp/keys.json
          # Mask secrets so they never appear in logs
          echo "::add-mask::$(jq -r .OWNER_MNEMONIC /tmp/keys.json)"
          echo "::add-mask::$(jq -r .OWNER_KEY /tmp/keys.json)"
          echo "::add-mask::$(jq -r .RESCUER_MNEMONIC /tmp/keys.json)"
          echo "::add-mask::$(jq -r .RESCUER_KEY /tmp/keys.json)"
          # Export to env for later steps
          echo "OWNER_MNEMONIC=$(jq -r .OWNER_MNEMONIC /tmp/keys.json)" >> "$GITHUB_ENV"
          echo "OWNER_KEY=$(jq -r .OWNER_KEY /tmp/keys.json)" >> "$GITHUB_ENV"
          echo "RESCUER_MNEMONIC=$(jq -r .RESCUER_MNEMONIC /tmp/keys.json)" >> "$GITHUB_ENV"
          echo "RESCUER_KEY=$(jq -r .RESCUER_KEY /tmp/keys.json)" >> "$GITHUB_ENV"
          echo "OWNER_ADDRESS=$(jq -r .OWNER_ADDRESS /tmp/keys.json)" >> "$GITHUB_OUTPUT"

      - name: Publish funding address to demo-output
        run: |
          git config user.name "thereal_awetoby"
          git config user.email "awedavid2007@gmail.com"
          git checkout -B demo-output
          {
            echo "# XO chipnet demo"
            echo ""
            echo "Fund this chipnet address with at least 60,000 sats:"
            echo ""
            echo '`${{ steps.keys.outputs.OWNER_ADDRESS }}`'
            echo ""
            echo "The workflow is waiting for the funds (up to 2 hours), then it will"
            echo "run the Nomos vault demo and commit the results here."
          } > README-demo.md
          git add README-demo.md
          git commit --no-verify -m "XO chipnet demo: funding address"
          git push origin demo-output --force

      - name: Wait for funding (up to 2h)
        run: |
          ADDRESS="${{ steps.keys.outputs.OWNER_ADDRESS }}"
          echo "Waiting for funding at $ADDRESS (up to 2 hours)…"
          DEADLINE=$(( $(date +%s) + 7200 ))
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            BALANCES=$(curl -s "https://chipnet.chaingraph.cash/api/address/$ADDRESS" 2>/dev/null || true)
            SATS=$(echo "$BALANCES" | jq -r '(.totalReceived // .balance // 0) * 100000000 | floor' 2>/dev/null || echo 0)
            if [ "$SATS" -ge 60000 ]; then
              echo "Funded: $SATS sats"
              exit 0
            fi
            echo "  not funded yet ($SATS sats), retrying in 60s…"
            sleep 60
          done
          echo "Timed out waiting for funding"
          exit 1

      - name: Run chipnet demo
        working-directory: xo
        run: |
          mkdir -p xo-chipnet-data
          node scripts/chipnet.mjs run 2>&1 | tee chipnet-output.txt

      - name: Commit invitations + output to demo-output
        run: |
          git config user.name "thereal_awetoby"
          git config user.email "awedavid2007@gmail.com"
          git checkout -B demo-output
          cp xo/invitations/*.json . 2>/dev/null || true
          cp xo/chipnet-output.txt . 2>/dev/null || true
          git add -A
          git commit --no-verify -m "XO chipnet demo: invitations + output" || echo "Nothing to commit"
          git push origin demo-output --force
