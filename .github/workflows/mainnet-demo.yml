name: mainnet-demo

on:
  push:
    branches: [tmp-mainnet-demo]

jobs:
  demo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PRIVATE_KEY: L3p6U4EvTYWuiMf2yGdFnttbN4re5JLZGrCMPj8skkxe8GdqYLcn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run mainnet demo
        run: |
          cd contracts/solidcash
          npm ci --no-audit --no-fund
          set +e
          PRIVATE_KEY="$PRIVATE_KEY" npm run demo:mainnet > /tmp/demo-output.txt 2>&1
          echo "demo exit code: $?" >> /tmp/demo-output.txt
          cat /tmp/demo-output.txt
      - name: Save output to a branch
        if: always()
        run: |
          git config user.name "thereal_awetoby"
          git config user.email "awedavid2007@gmail.com"
          git checkout -b demo-output
          cp /tmp/demo-output.txt demo-output.txt
          git add demo-output.txt
          git commit -m "Mainnet demo output" || echo "nothing to commit"
          git push origin demo-output
