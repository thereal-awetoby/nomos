name: mainnet-demo
on:
  push:
    branches: [tmp-mainnet-demo]
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      PAYTACA: bitcoincash:qpqrel837enktgz3vanchsf7uapj883ruy76h8h7jw
      OUT: /tmp/demo-output.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          (cd contracts/solidcash && npm ci --no-audit --no-fund)
          (cd frontend && npm ci --no-audit --no-fund)
      - name: Generate a key that never leaves this runner
        working-directory: contracts/solidcash
        run: |
          node --input-type=module -e "
          import {generatePrivateKey,encodePrivateKeyWif,secp256k1,hash160,encodeCashAddress} from '@bitauth/libauth';
          const k = generatePrivateKey(() => crypto.getRandomValues(new Uint8Array(32)));
          const a = encodeCashAddress({prefix:'bitcoincash',type:'p2pkh',payload:hash160(secp256k1.derivePublicKeyCompressed(k))});
          console.log(encodePrivateKeyWif(k,'mainnet')); console.log(typeof a === 'string' ? a : a.address);" > /tmp/key.txt
          WIF=$(sed -n 1p /tmp/key.txt); ADDR=$(sed -n 2p /tmp/key.txt); rm /tmp/key.txt
          echo "::add-mask::$WIF"
          echo "PRIVATE_KEY=$WIF" >> "$GITHUB_ENV"
          echo "DEMO_ADDRESS=$ADDR" >> "$GITHUB_ENV"
      - name: Publish the funding address
        run: |
          git config user.name "thereal_awetoby"
          git config user.email "awedavid2007@gmail.com"
          git checkout -b demo-output
          echo "Fund this address with 0.0003 BCH: $DEMO_ADDRESS" > demo-output.txt
          git add demo-output.txt
          git commit -m "Mainnet demo funding address"
          git push -f origin demo-output
      - name: Wait for funding (up to 2 hours)
        working-directory: frontend
        run: |
          node --input-type=module -e "
          import { ElectrumNetworkProvider } from 'cashscript';
          const p = new ElectrumNetworkProvider('mainnet');
          for (let i = 0; i < 240; i++) {
            const total = (await p.getUtxos(process.env.DEMO_ADDRESS)).reduce((s, u) => s + u.satoshis, 0n);
            if (total >= 30000n) { console.log('funded', total); process.exit(0); }
            await new Promise((r) => setTimeout(r, 30000));
          }
          process.exit(1);" 2>&1 | tee -a "$OUT"
      - name: Split into one deploy coin and three fee coins
        working-directory: frontend
        run: |
          node --input-type=module -e "
          import { ElectrumNetworkProvider, TransactionBuilder, SignatureTemplate } from 'cashscript';
          const p = new ElectrumNetworkProvider('mainnet');
          const key = new SignatureTemplate(process.env.PRIVATE_KEY);
          const a = process.env.DEMO_ADDRESS;
          const utxos = (await p.getUtxos(a)).filter((u) => !u.token);
          const total = utxos.reduce((s, u) => s + u.satoshis, 0n);
          const fee = BigInt(200 + 150 * utxos.length + 34 * 4);
          const small = (total - 16000n - fee) / 3n;
          if (small < 1000n) { console.log('not enough to split', total); process.exit(1); }
          const tb = new TransactionBuilder({ provider: p });
          for (const u of utxos) tb.addInput(u, key.unlockP2PKH());
          tb.addOutput({ to: a, amount: 16000n });
          for (let i = 0; i < 3; i++) tb.addOutput({ to: a, amount: small });
          console.log('split', (await tb.send()).txid);
          process.exit(0);" 2>&1 | tee -a "$OUT"
      - name: Run mainnet demo
        working-directory: contracts/solidcash
        run: |
          set +e
          npm run demo:mainnet 2>&1 | tee -a "$OUT"
          echo "demo exit code: ${PIPESTATUS[0]}" | tee -a "$OUT"
      - name: Send what is left back to Paytaca
        if: always()
        working-directory: frontend
        run: |
          node --input-type=module -e "
          import { ElectrumNetworkProvider, TransactionBuilder, SignatureTemplate } from 'cashscript';
          const p = new ElectrumNetworkProvider('mainnet');
          const key = new SignatureTemplate(process.env.PRIVATE_KEY);
          const utxos = (await p.getUtxos(process.env.DEMO_ADDRESS)).filter((u) => !u.token);
          const total = utxos.reduce((s, u) => s + u.satoshis, 0n);
          console.log('leftover', total);
          if (total > 1000n) {
            const tb = new TransactionBuilder({ provider: p });
            for (const u of utxos) tb.addInput(u, key.unlockP2PKH());
            tb.addOutput({ to: process.env.PAYTACA, amount: total - BigInt(200 + 150 * utxos.length) });
            console.log('returned', (await tb.send()).txid);
          }
          process.exit(0);" 2>&1 | tee -a "$OUT" || true
      - name: Save output
        if: always()
        run: |
          [ -f "$OUT" ] && cp "$OUT" demo-output.txt
          git add demo-output.txt
          git commit -m "Mainnet demo output" || true
          git push -f origin demo-output
