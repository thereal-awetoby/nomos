name: mainnet-demo

on:
  push:
    branches: [tmp-mainnet-demo]

jobs:
  demo:
    runs-on: ubuntu-latest
    env:
      PRIVATE_KEY: L3p6U4EvTYWuiMf2yGdFnttbN4re5JLZGrCMPj8skkxe8GdqYLcn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run mainnet demo
        run: cd contracts/solidcash && npm ci --no-audit --no-fund && npm run demo:mainnet
